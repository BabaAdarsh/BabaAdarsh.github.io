<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#111b29"/><meta name="description" content="A private, mobile-first control room for your goals, work and ChatGPT workflows."/>
<link rel="manifest" href="./manifest.webmanifest"/><link rel="icon" type="image/png" href="./icons/icon-192.png"/>
<title>Adarsh HQ — Mission Control</title>
<link rel="stylesheet" href="./styles.css"/>
</head><body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">A<span>•</span></div><div><strong>ADARSH <em>HQ</em></strong><small>Personal command centre</small></div></div>
    <div class="side-caption">WORKSPACE</div>
    <nav id="desktopNav" aria-label="Navigation"></nav>
    <div class="sidebar-footer"><div class="avatar">A</div><div><strong>Your private HQ</strong><small id="sidebarStatus">Device-only · Not synced</small></div></div>
  </aside>
  <div class="app-body">
   <header class="topbar"><div class="topbar-title"><div class="eyebrow" id="dateLabel">YOUR DAY</div><h1 id="pageTitle">Good morning</h1></div><div class="top-actions"><span class="status-pill"><span class="status-dot"></span> LOCAL MODE</span><button class="iconbtn" id="installBtnTop" title="Install HQ" aria-label="Install HQ">↧</button><button class="iconbtn" id="refreshBtn" title="Refresh" aria-label="Refresh">↻</button></div></header>
   <div class="content" id="view" aria-live="polite"></div>
   <nav class="bottom-nav" id="mobileNav" aria-label="Mobile navigation"></nav>
  </div>
</div>
<div id="modalRoot"></div><div id="toast" role="status" aria-live="polite"></div>
<script src="./firebase-config.js"></script>
<script src="./app.js" defer></script>
<script type="module" src="./firebase-sync.js"></script>
</body></html>
